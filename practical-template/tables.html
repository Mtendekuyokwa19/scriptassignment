<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/site.css" />
    <title>Table</title>
    <style>
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }
      .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        max-width: 400px;
        text-align: center;
      }
      .modal-buttons button {
        margin: 10px;
        padding: 10px 20px;
      }
      .edit-form {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .edit-form input, .edit-form textarea {
        margin: 10px 0;
        padding: 5px;
        width: 80%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="toggle">
        <a id="toggle-nav"><i class="fa fa-navicon cog"></i></a>
      </div>
    </div>
    <div class="container">
      <div class="sidebar" id="sidebar">
        <a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
        <a href="form.html"><i class="fa fa-shopping-cart"></i> Forms</a>
        <a href="tables.html"><i class="fa fa-shopping-bag"></i> Tables</a>
      </div>
      <div class="content">
        <div class="left">
          <h3>Product Records</h3>
          <div class="section-container">
            <div class="section-header">Details of available products</div>
            <div class="section-content">
              <div id="loader" class="loader"></div>
              <table id="productTable">
                <thead>
                  <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Description</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="right"></div>
      </div>
    </div>
    <div id="deleteModal" class="modal">
      <div class="modal-content">
        <p>Are you sure you want to delete this product?</p>
        <div class="modal-buttons">
          <button id="confirmDelete">Yes</button>
          <button id="cancelDelete">No</button>
        </div>
      </div>
    </div>
    <div id="editModal" class="modal">
      <div class="modal-content">
        <form id="editForm" class="edit-form">
          <input type="hidden" id="editId" />
          <input type="text" id="editName" placeholder="Name" required />
          <input type="number" id="editPrice" placeholder="Price" required />
          <input type="number" id="editQuantity" placeholder="Quantity" required />
          <textarea id="editDescription" placeholder="Description" required></textarea>
          <div class="modal-buttons">
            <button type="submit">Update</button>
            <button type="button" id="cancelEdit">Cancel</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(() => {
        const loader = $("#loader");
        const tableBody = $("#tableBody");
        const deleteModal = $("#deleteModal");
        const editModal = $("#editModal");
        let productToDelete = null;
        let productToEdit = null;

        loader.show();

        // Simulate loading delay and fetch products
        setTimeout(() => {
          loader.hide();

          $.get("http://localhost:3000/products", function (data) {
            if (Array.isArray(data)) {
              data.forEach((product) => {
                tableBody.append(`
                  <tr data-id="${product.id}">
                    <td>${product.id || ''}</td>
                    <td>${product.name || ''}</td>
                    <td>${product.price || ''}</td>
                    <td>${product.quantity || ''}</td>
                    <td>${product.description || ''}</td>
                    <td>
                      <a href="#" class="edit">Edit</a> |
                      <a href="#" class="delete">Delete</a>
                    </td>
                  </tr>
                `);
              });
            } else {
              console.error("Invalid data format received from API:", data);
              alert("Failed to load products. Invalid data format.");
            }
          }).fail((xhr, status, error) => {
            console.error("Fetch error:", status, error);
            alert("Failed to fetch products. Ensure the server is running at http://localhost:3000/products. Error: " + error);
          });
        }, 2000);

        // Delete functionality
        $(document).on("click", ".delete", function (e) {
          e.preventDefault();
          const row = $(this).closest("tr");
          productToDelete = row.data("id");
          if (productToDelete) {
            deleteModal.show();
          } else {
            alert("Error: Could not determine product ID.");
          }
        });

        $("#confirmDelete").on("click", function () {
          if (productToDelete) {
            $.ajax({
              url: `http://localhost:3000/products/${productToDelete}`,
              method: "DELETE",
              contentType: "application/json",
              success: function (response) {
                $(`tr[data-id="${productToDelete}"]`).remove();
                deleteModal.hide();
                console.log("Product deleted successfully:", response);
                alert("Product deleted successfully.");
              },
              error: function (xhr, status, error) {
                console.error("Delete error:", status, error);
                alert("Failed to delete product. Ensure the server supports DELETE at http://localhost:3000/products/{id}. Error: " + error);
                deleteModal.hide();
              }
            });
          }
        });

        $("#cancelDelete").on("click", function () {
          deleteModal.hide();
        });

        // Edit functionality
        $(document).on("click", ".edit", function (e) {
          e.preventDefault();
          const row = $(this).closest("tr");
          productToEdit = row.data("id");

          $.get(`http://localhost:3000/products/${productToEdit}`, function (product) {
            console.log(productToEdit)
            if (product) {
              $("#editId").val(product.id);
              $("#editName").val(product.name || '');
              $("#editPrice").val(product.price || '');
              $("#editQuantity").val(product.quantity || '');
              $("#editDescription").val(product.description || '');
              editModal.show();
            } else {
              alert("Error: Could not load product data.");
            }
          }).fail((xhr, status, error) => {
            console.error("Fetch product error:", status, error);
            alert("Failed to load product for editing. Error: " + error);
          });
        });

        $("#editForm").on("submit", function (e) {
          e.preventDefault();
          const updatedProduct = {
            id: $("#editId").val(),
            name: $("#editName").val(),
            price: $("#editPrice").val(),
            quantity: $("#editQuantity").val(),
            description: $("#editDescription").val()
          };
          console.log("Sending update:", JSON.stringify(updatedProduct));

          $.ajax({
            url: `http://localhost:3000/products/${productToEdit}`,
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify(updatedProduct),
            success: function (response) {
              $.get(`http://localhost:3000/products/${productToEdit}`, function (product) {
                const row = $(`tr[data-id="${productToEdit}"]`);
                row.find("td:eq(1)").text(product.name || '');
                row.find("td:eq(2)").text(product.price || '');
                row.find("td:eq(3)").text(product.quantity || '');
                row.find("td:eq(4)").text(product.description || '');
                editModal.hide();
                console.log("Product updated successfully:", response);
                alert("Product updated successfully.");
              }).fail((xhr, status, error) => {
                console.error("Refresh error:", status, error);
                alert("Failed to refresh product data. Error: " + error);
              });
            },
            error: function (xhr, status, error) {
              console.error("Update error:", status, error);
              alert("Failed to update product. Ensure the server supports PUT at http://localhost:3000/products/{id}. Error: " + error);
              editModal.hide();
            }
          });
        });

        $("#cancelEdit").on("click", function () {
          editModal.hide();
        });

        // Hide modals if clicked outside
        $(window).on("click", function (e) {
          if (e.target.id === "deleteModal") {
            deleteModal.hide();
          } else if (e.target.id === "editModal") {
            editModal.hide();
          }
        });
      });
    </script>
  </body>
</html>
