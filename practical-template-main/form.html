<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/site.css" />
  <title>Product Form</title>
</head>
<body>
  <div class="header">
    <div class="toggle">
      <a id="toggle-nav"><i class="fa fa-navicon cog"></i></a>
    </div>
  </div>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a>
      <a href="form.html"><i class="fa fa-shopping-cart"></i> Forms</a>
      <a href="tables.html"><i class="fa fa-shopping-bag"></i> Tables</a>
    </div>
    <div class="content">
      <div class="left">
        <h3>Product Registration</h3>
        <div class="section-container">
          <div class="section-header">Enter product details</div>
          <div class="section-content">
            <form id="productForm">
              <label class="label" for="name">Product Name</label>
              <input type="text" id="name" name="name" /><br />

              <label class="label" for="price">Price</label>
              <input type="number" id="price" name="price" /><br />

              <label class="label" for="quantity">Quantity</label>
              <input type="number" id="quantity" name="quantity" /><br />

              <label class="label" for="description">Description</label>
              <textarea rows="6" id="description" name="description"></textarea><br />

              <button class="form-button" id="save">Save</button>
            </form>
          </div>
        </div>
      </div>
      <div class="right"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close" id="span">&times;</span>
      <h3>Message</h3>
      <p>Edit me for success and error messages</p>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function () {
      function showModal(message) {
        $("#myModal p").text(message);
        $("#myModal").css("display", "block");
      }

      function clearForm() {
        $("#productForm")[0].reset();
      }

      $("#save").click(function (e) {
        e.preventDefault();

        const name = $("#name").val().trim();
        const price = $("#price").val().trim();
        const quantity = $("#quantity").val().trim();
        const description = $("#description").val().trim();

        // Validation
        if (!name || name.length < 5 || name.length > 50) {
          showModal("Product Name must be between 5 and 50 characters.");
          return;
        }
        if (!price || isNaN(price) || Number(price) <= 0) {
          showModal("Price must be a number greater than 0.");
          return;
        }
        if (!quantity || isNaN(quantity) || Number(quantity) <= 0) {
          showModal("Quantity must be a number greater than 0.");
          return;
        }
        if (!description || description.length < 5 || description.length > 200) {
          showModal("Description must be between 5 and 200 characters.");
          return;
        }

        const data = {
          name,
          price: Number(price),
          quantity: Number(quantity),
          description
        };

        $.ajax({
          url: "http://localhost:3000/products/",
          type: "POST",
          data: JSON.stringify(data),
          contentType: "application/json",
          success: function (response) {
            showModal("✅ Product registered successfully!");
            addToTable(data);
            clearForm();
          },
          error: function (xhr) {
            showModal("❌ Failed to register product: " + xhr.responseText);
          }
        });
      });

      $("#span").click(function () {
        $("#myModal").css("display", "none");
      });

      function addToTable(data) {
        if ($("#productTable").length === 0) {
          $(".right").html(`
            <table id="productTable" border="1" style="width:100%;margin-top:20px;">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th>Quantity</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          `);
        }
        $("#productTable tbody").append(`
          <tr>
            <td>${data.name}</td>
            <td>${data.price}</td>
            <td>${data.quantity}</td>
            <td>${data.description}</td>
          </tr>
        `);
      }
    });
  </script>
</body>
</html>
